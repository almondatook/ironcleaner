# Конфиг Railway. Сборка — по Dockerfile в корне (Railway найдёт его сам,
# но пропишем явно). Значения enum строго капсом — так требует схема Railway.
# Healthcheck ходит на /healthz (лёгкий эндпоинт без обработки PDF).

[build]
builder = "DOCKERFILE"

[deploy]
healthcheckPath = "/healthz"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
